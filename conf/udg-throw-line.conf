# udg-throw-line-service configuration (installed as /etc/udg-throw-line.conf).
#
# Read in this order, each layer overriding the previous one key by key:
#   1. /etc/udg-throw-line.conf          - this file, baked into the read-only image
#   2. <data_dir>/udg-throw-line.conf    - optional per-kiosk overrides on /data,
#                                          e.g. only "[laser] backend = gpio" + "line = 4"
#   3. command-line options              - --port, --set detect.visibility=0.4, ...
# An invalid value is logged and ignored (the previous layer's value stays):
# the service never refuses to start because of this file.
#
# Every value below is the built-in default.
#
# Coordinates: "red plane" pixels = the frame at half resolution (one red
# photosite per 2x2 Bayer cell); 640x480 frames give a 320x240 red plane.

[camera]
# CIF capture node. auto = the video4linux node named stream_cif_mipi_id0.
video = auto
# Sensor sub-device (mode, flips, exposure, gain). auto = the v4l-subdev whose
# name contains "ov5647"; none = leave the sensor as it is.
subdev = auto
# Sensor mode, picked by size (OV5647 modes: 2592x1944 @15, 1920x1080 @30,
# 1296x972 @45, 640x480 @90 fps). 640x480 is binned from the full sensor:
# whole field of view, 90 frames/s, and fast to analyse.
width = 640
height = 480
# Bayer order. auto = from the sensor (it changes with hflip/vflip).
bayer = auto
# rkcif memory layout of RAW10: word_low = one 16-bit word per pixel, low
# aligned (unambiguous); word_high; compact (RK3588 default, 4 pixels in 5
# bytes, decoding assumed MIPI-like - unverified); keep = do not touch.
memory_mode = word_low
# Capture buffers queued in the driver.
buffers = 4
# Sensor flips (only change the snapshot orientation and the direction of
# "pos" - recalibrate after changing them).
hflip = no
vflip = no
# Exposure in sensor lines and analogue gain (16 = 1.0x, OV5647 range
# 16-1023). 0 = leave the driver's value (1000 lines clipped to the frame,
# gain 2.0x). A short exposure keeps only the laser: tune it with
# `udg-throw-line camera exposure=... gain=...` and `snapshot`, then write it here.
exposure = 0
gain = 0
# Seconds between two attempts to open a missing camera.
retry = 5.0
# Seconds without a frame before the stream is restarted.
frame_timeout = 2.0

[laser]
# led  = gpio-leds entry of the device tree (/sys/class/leds/<led>/brightness):
#        held "off" by the kernel from boot, the production choice;
# gpio = GPIO character device line (bring-up: any pin, no new device tree);
# none = no output (laser always powered).
backend = led
led = udg-laser
# gpio backend only: chip and line offset. GPIOn_Xk is /dev/gpiochipn,
# line 8 x X + k with A=0, B=1, C=2, D=3 (GPIO1_A4 -> gpiochip1 line 4);
# check with `gpioinfo`. Not pin 7 (recovery) nor 19/21/23 (LED strip).
chip = /dev/gpiochip1
line = -1
# Active-low driver stage (relay module...): 1 still means "laser on".
active_low = no
# Laser state when the service starts. The game switches it with `laser on`.
startup = off

[detect]
# Distance between two samples along the line, red-plane pixels.
step = 2
# Half-length of the window across the line around each sample, red-plane
# pixels. Must cover the line's jitter, but stay shorter than the shift of
# the laser on a shoe (see doc/DETECTION.md).
search = 6
# Largest move of the laser peak still counted as "line intact", red-plane pixels.
tolerance = 2.0
# A sample is broken when its contrast falls below visibility x reference.
visibility = 0.5
# Shortest broken run that counts as a crossing, as a fraction of the line.
min_width = 0.02
# Intact samples allowed inside one broken run (bridges noise in a shoe edge).
gap = 1
# Fraction of the line broken at once above which the state is "blocked"
# (camera covered, laser fault...) instead of "crossed".
max_width = 0.6
# Consecutive frames needed to enter "crossed"/"blocked", and to go back to "clear".
confirm_frames = 2
release_frames = 5
# Frames ignored after the laser switches on or the stream starts.
settle_frames = 4
# Slow tracking of the reference while the line is clear (0 = off).
adapt = 0.002
# Report pos/from/to from the other end of the line.
reverse_position = no

[calibration]
# Frames averaged with the laser off, then with the laser on.
frames = 8
# Frames skipped after each laser switch (still in the driver's queue).
settle_frames = 5
# Smallest laser contrast accepted, as a fraction of the pixel full scale.
min_contrast = 0.04
# A sample must be this many times brighter with the laser than the floor
# texture without it.
snr = 3.0
# Fraction of the line that must be usable for the calibration to succeed.
min_usable = 0.6
# Samples trimmed at each end of the line found automatically.
margin = 2

[network]
# The game talks to this address and port. Loopback only (127.x.x.x, anything
# else is refused): the protocol has no authentication.
address = 127.0.0.1
port = 47810
# Seconds an event subscription lasts without renewal (the game renews it
# every few seconds).
subscription_ttl = 10.0
max_subscribers = 8

[service]
# Persistent directory (on /data): udg-throw-line.conf override, calibration.conf.
data_dir = /data/udg-throw-line
# Volatile directory (tmpfs): snapshot.bmp.
run_dir = /run/udg-throw-line

[simulate]
# --simulate only: synthetic camera (same width/height as [camera]).
fps = 30.0
# Laser line of the synthetic scene, normalized x0,y0,x1,y1.
line = 0.08,0.62,0.92,0.55
# Laser brightness (fraction of full scale) and noise along the line.
intensity = 0.5
noise = 0.02
